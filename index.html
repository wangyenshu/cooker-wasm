<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cooker</title>
<style>
body { font-family: sans-serif; max-width: 46em; margin: 1em auto; padding: 0 1em; line-height: 1.4; }
fieldset { margin: .5em 0; }
label { display: block; margin: .25em 0; }
code { font-size: .95em; }
pre { background: #f3f3f3; padding: .5em; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24em; overflow-y: auto; }
</style>
</head>
<body>
<h1>cooker</h1>
<p>TiddlyWiki <a href="https://github.com/TiddlyWiki/cooker">cooker</a>, on Ruby 1.8.7 compiled to WebAssembly. Files are processed in browser.</p>

<h2>ginsu.rb</h2>
<label>TiddlyWiki file: <input type="file" id="ginsu-file" accept=".html,.htm"></label>
<fieldset>
<legend>Options</legend>
<label><input type="checkbox" id="ginsu-s"> <code>-s, --subdirectories</code> Split tiddlers into subdirectories by type</label>
<label><code>-t, --tag TAGDIRECTORY</code> With <code>-s</code>, put tiddlers with this tag in their own subdirectory: <input type="text" id="ginsu-t"></label>
<label><code>-c, --charset CHARSET</code> Character set of file names: <input type="text" id="ginsu-c"></label>
<label><input type="checkbox" id="ginsu-q"> <code>-q, --quiet</code> Quiet mode, do not output file names</label>
</fieldset>
<button id="run-ginsu" disabled>Run ginsu.rb</button>

<h2>Output</h2>
<p><button id="download" hidden></button></p>
<pre id="log">Loading Ruby…</pre>

<script type="module">
import { zipSync } from './vendor/fflate.js';

const $ = (id) => document.getElementById(id);
const log = $('log');
const print = (t) => { log.textContent += t + '\n'; log.scrollTop = log.scrollHeight; };

// ---- Ruby worker ----
const worker = new Worker('cooker-worker.js');
let ready = false, busy = false, pending = null;
worker.onmessage = ({ data: m }) => {
  if (m.type === 'ready') { ready = true; log.textContent = ''; print('Ruby 1.8.7 ready.'); refresh(); }
  else if (m.type === 'out') print(m.text);
  else if (m.type === 'done') pending.resolve(m);
  else if (m.type === 'fail') {
    if (pending) pending.reject(new Error(m.error));
    else print('Could not start Ruby: ' + m.error + (location.protocol === 'file:' ? ' (serve this page over http)' : ''));
  }
};
function ruby(argv, cwd, files) {
  return new Promise((resolve, reject) => {
    pending = { resolve, reject };
    worker.postMessage({ type: 'run', argv, cwd, files });
  }).finally(() => { pending = null; });
}
function refresh() {
  $('run-ginsu').disabled = !ready || busy || !$('ginsu-file').files.length;
}

// ---- ginsu.rb ----
$('ginsu-file').onchange = refresh;
$('run-ginsu').onclick = () => go(async () => {
  const file = $('ginsu-file').files[0];
  const argv = ['-I/cooker', '/cooker/ginsu.rb', file.name];
  if ($('ginsu-s').checked) argv.push('-s');
  for (const o of ['t', 'c']) if ($('ginsu-' + o).value.trim()) argv.push('-' + o, $('ginsu-' + o).value.trim());
  if ($('ginsu-q').checked) argv.push('-q');
  // Run next to a writable copy of the wiki, as `ginsu.rb wiki.html` would in a shell:
  // ginsu creates wiki.html.0/ beside it, and that directory is the zip.
  const res = await start(argv, '/out', [{ path: file.name, file }]);
  const top = res.files.find((f) => f.dir);
  const split = top ? res.files.filter((f) => f.path.startsWith(top.path)) : [];
  if (split.some((f) => !f.dir)) save(top.path.replace(/\/$/, '') + '.zip', zip(split));
});

async function start(argv, cwd, files) {
  log.textContent = '';
  offered = null; $('download').hidden = true;
  print('$ ruby ' + argv.slice(1).map((a) => /^[\w@%+=:,./-]+$/.test(a) ? a : "'" + a.replace(/'/g, "'\\''") + "'").join(' '));
  const t0 = performance.now();
  const res = await ruby(argv, cwd, files);
  print(`[exit ${res.status}, ${Math.round(performance.now() - t0)} ms]`);
  return res;
}
async function go(fn) {
  busy = true; refresh();
  try { await fn(); } catch (e) { print('Error: ' + e.message); }
  busy = false; refresh();
}

// ---- downloads ----
let offered = null;
function save(name, data) {
  name = name.split('/').pop();
  const blob = data instanceof Blob ? data : new Blob([data]);
  offered = { name, blob };
  $('download').textContent = 'Download ' + name;
  $('download').hidden = false;
}
$('download').onclick = () => {
  if (!offered) return;
  const { name, blob } = offered;
  const a = document.createElement('a');
  // A generic type keeps browsers from offering to open the file with a handler.
  a.href = URL.createObjectURL(new Blob([blob], { type: 'application/octet-stream' }));
  a.download = name;
  document.body.append(a); // Firefox ignores clicks on detached links
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
};

// Archive with fflate (https://github.com/101arrowz/fflate).
// os 3 (Unix): unzip on Linux then keeps UTF-8 names as they are and applies these permissions.
function zip(entries) {
  const files = {};
  for (const e of entries) {
    const attrs = e.dir ? 0o40755 * 0x10000 + 0x10 : 0o100644 * 0x10000;
    files[e.path] = [e.dir ? new Uint8Array(0) : e.data, { mtime: new Date(e.mtime), os: 3, attrs }];
  }
  return new Blob([zipSync(files)], { type: 'application/zip' });
}
</script>
</body>
</html>
